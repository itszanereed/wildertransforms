<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wilder Transforms</title>
<meta name="theme-color" content="#0a0a09" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wilder" />
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
<link rel="manifest" href="/app/manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a09; --bg-2:#121210; --card:#161614; --card-2:#1c1b18; --line:#26251f;
    --text:#f3efe6; --muted:#9d988b; --accent:#ff6a1a; --accent-2:#ffb547; --accent-rgb:255,106,26; --accent2-rgb:255,181,71; --on-accent:#120800; --good:#3ddc84;
    --display:'Anton', Impact, sans-serif; --body:'Inter', system-ui, -apple-system, sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100%}
  body{overscroll-behavior-y:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea,select{font:inherit;color:var(--text)}
  .app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(var(--safe-t) + 18px) 20px calc(var(--safe-b) + 96px)}
  .display{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1}
  .accent{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .muted{color:var(--muted)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .1s, opacity .2s}
  a.btn{text-decoration:none;color:var(--text)}
  a.btn-primary{color:var(--on-accent)}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:var(--on-accent)}
  .btn-ghost{background:var(--card);border:1px solid var(--line)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .field{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:16px;outline:none}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
  .err{color:#ff8a5c;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
  .demo{background:rgba(var(--accent2-rgb),.1);border:1px solid rgba(var(--accent2-rgb),.35);color:var(--accent-2);font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:16px;text-align:center}

  /* ---- Login ---- */
  .login{min-height:calc(100dvh - 140px);display:flex;flex-direction:column;justify-content:center;gap:14px}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-size:36px;margin-bottom:10px}
  .login h1{font-size:46px}
  .login p{color:var(--muted);margin-bottom:10px;line-height:1.5}
  .code{letter-spacing:.5em;text-align:center;font-size:24px;font-weight:700}

  /* ---- Header ---- */
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .hello{font-size:14px;color:var(--muted)}
  .hello b{display:block;color:var(--text);font-size:20px;margin-top:2px}
  .tier{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.08);padding:6px 10px;border-radius:999px;white-space:nowrap}

  /* ---- Day switcher ---- */
  .day{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:14px}
  .day button{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card-2)}
  .day button[disabled]{opacity:.25}
  .day .label{text-align:center}
  .day .label b{font-family:var(--display);font-size:24px;text-transform:uppercase;display:block;line-height:1.1}
  .day .label small{color:var(--muted);font-size:12px}

  /* ---- Progress card ---- */
  .progress{display:flex;align-items:center;gap:18px;background:radial-gradient(ellipse 80% 120% at 100% 0%,rgba(var(--accent-rgb),.16),transparent 70%),var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:22px}
  .ring{position:relative;width:96px;height:96px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .num b{font-family:var(--display);font-size:28px;line-height:1}
  .ring .num small{display:block;font-size:11px;color:var(--muted)}
  .streak b{font-family:var(--display);font-size:40px;line-height:1}
  .streak small{color:var(--muted);font-size:13px}
  .streak .msg{font-size:14px;margin-top:6px;font-weight:600}

  /* ---- Section title ---- */
  .sec{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
  .sec h2{font-family:var(--display);font-size:22px;text-transform:uppercase;font-weight:400}
  .link{color:var(--accent);font-weight:700;font-size:14px}

  /* ---- Supplement rows ---- */
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;transition:border-color .2s, background .2s}
  .row .box{width:30px;height:30px;border-radius:9px;border:2px solid #3a382f;display:grid;place-items:center;flex:0 0 auto;transition:all .2s}
  .row .box svg{opacity:0;transform:scale(.6);transition:all .2s}
  .row.on{border-color:rgba(var(--accent-rgb),.5);background:linear-gradient(90deg,rgba(var(--accent-rgb),.10),transparent 70%),var(--card)}
  .row.on .box{background:var(--accent);border-color:var(--accent)}
  .row.on .box svg{opacity:1;transform:none}
  .row .name{font-weight:700;font-size:16px}
  .row .dose{color:var(--muted);font-size:13px;margin-top:2px}
  .empty{text-align:center;padding:30px 18px;border:1px dashed #3a382f;border-radius:16px;color:var(--muted)}
  .empty b{display:block;color:var(--text);margin-bottom:6px}

  /* ---- Sheet (edit list) ---- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--bg-2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 20px calc(var(--safe-b) + 24px);transform:translateY(100%);transition:transform .25s ease;max-height:86dvh;overflow:auto}
  .sheet.open{transform:none}
  .grab{width:40px;height:5px;border-radius:3px;background:#3a382f;margin:0 auto 16px}
  .sheet h3{font-family:var(--display);font-size:28px;text-transform:uppercase;font-weight:400;margin-bottom:14px}
  .edit-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .edit-row .name{font-weight:700}
  .edit-row .dose{color:var(--muted);font-size:13px}
  .del{color:#ff8a5c;font-weight:700;font-size:14px;padding:8px}
  .add{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin:18px 0 12px}

  /* ---- Placeholder screens ---- */
  .soon{text-align:center;padding:60px 10px}
  .soon .display{font-size:40px;margin:14px 0 10px}
  .soon p{color:var(--muted);line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
  .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
  .card .v{font-size:17px;font-weight:600;margin-top:4px;word-break:break-all}

  /* ---- Tab bar ---- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,9,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 10px calc(var(--safe-b) + 8px)}
  .tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--tabs,3),1fr)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;color:var(--muted);font-size:11px;font-weight:600}
  .tab svg{width:24px;height:24px}
  .tab.on{color:var(--accent)}

  /* ---- Install hint ---- */
  .install{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 84px);z-index:35;max-width:496px;margin:0 auto;background:var(--card-2);border:1px solid rgba(var(--accent-rgb),.45);border-radius:16px;padding:14px 44px 14px 16px;font-size:14px;line-height:1.45;box-shadow:0 20px 50px -10px rgba(0,0,0,.8)}
  .install b{color:var(--accent)}
  .install .x{position:absolute;top:8px;right:8px;width:30px;height:30px;color:var(--muted);font-size:20px}


  /* ---- Program / questionnaire ---- */
  .hero-card{background:radial-gradient(ellipse 80% 120% at 100% 0%,rgba(var(--accent-rgb),.16),transparent 70%),var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;margin-bottom:16px}
  .steps{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .st{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600;font-size:15px}
  .st i{width:28px;height:28px;border-radius:50%;border:2px solid #3a382f;display:grid;place-items:center;font-style:normal;font-size:13px}
  .st.done{color:var(--text)} .st.done i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .st.now{color:var(--accent)} .st.now i{border-color:var(--accent)}
  .qbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
  .qbar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .qtitle{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:34px;line-height:1.05;margin-bottom:18px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-weight:600;font-size:16px;transition:all .15s}
  .opt.on{border-color:var(--accent);background:linear-gradient(90deg,rgba(var(--accent-rgb),.14),transparent),var(--card);color:var(--text)}
  textarea.field{resize:vertical;line-height:1.5}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chips span{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(var(--accent-rgb),.1);color:var(--accent)}
  .day-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .day-card.open{border-color:rgba(var(--accent-rgb),.45)}
  .day-head{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;text-align:left}
  .day-head b{display:block;font-size:16px}
  .day-head small{color:var(--muted);font-size:13px}
  .chev{color:var(--muted);transition:transform .2s}
  .day-card.open .chev{transform:rotate(90deg);color:var(--accent)}
  .day-body{padding:0 16px 14px}
  .ex{padding:12px 0;border-top:1px solid var(--line)}
  .ex-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .ex-top b{font-size:15px}
  .sr{font-family:var(--display);font-size:20px;color:var(--accent);white-space:nowrap}
  .ex-meta{display:flex;gap:10px;margin-top:4px}
  .ex-meta span{font-size:12px;color:var(--muted);font-weight:600}
  .ex-note{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
  .txt{font-size:15px;font-weight:500;line-height:1.55;word-break:normal}

  /* ---- Coach ---- */
  .app.wide{max-width:860px}
  .client{align-items:center}
  .pill{font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:var(--card-2);color:var(--muted);white-space:nowrap}
  .pill.hot{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
  .pill.good{background:rgba(61,220,132,.12);color:var(--good)}
  .pill.warn{background:rgba(var(--accent2-rgb),.12);color:var(--accent-2)}
  .pill.bad{background:rgba(255,90,90,.12);color:#ff8a8a}
  .notice{background:rgba(var(--accent2-rgb),.08);border:1px solid rgba(var(--accent2-rgb),.35);color:#f3dcb4;border-radius:14px;padding:14px;font-size:14px;line-height:1.5;margin-bottom:12px}
  .notice.bad{background:rgba(255,90,90,.08);border-color:rgba(255,90,90,.35);color:#ffc2c2}
  details.card summary{cursor:pointer;list-style:none}
  details.card summary::-webkit-details-marker{display:none}
  .answers{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .answers div{display:flex;flex-direction:column;gap:2px;font-size:14px}
  .answers span{color:var(--muted);font-size:12px}
  .ed label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
  .ed .field{padding:11px 12px;font-size:15px;border-radius:10px}
  .ed .field.strong{font-weight:700}
  .ed-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ed-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
  .ed-4 label{margin-top:8px}
  .ed-dayhead{display:flex;gap:10px;align-items:center}
  .ed-ex{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
  .ed-exhead{display:flex;gap:8px;align-items:center}
  .ed-btns{display:flex;gap:4px}
  .ed-btns button{width:34px;height:40px;border-radius:9px;background:var(--card-2);color:var(--muted);font-size:15px}
  .ed-btns button.x{color:#ff8a5c}
  .sticky-actions{position:sticky;bottom:calc(var(--safe-b) + 78px);z-index:20;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin:6px 0 14px;padding:10px;background:rgba(10,10,9,.9);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px}

  /* ---- Supplement protocol ---- */
  .proto{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
  .proto.cta{border-color:rgba(var(--accent-rgb),.45);background:linear-gradient(135deg,rgba(var(--accent-rgb),.12),transparent 60%),var(--card)}
  .proto.open{border-color:rgba(var(--accent-rgb),.45)}
  .proto-head{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;text-align:left;gap:12px}
  .proto-head b{display:block;font-size:16px}
  .proto-head small{color:var(--muted);font-size:13px;line-height:1.4;display:block;margin-top:2px}
  .proto.open .chev{transform:rotate(90deg);color:var(--accent)}
  .proto-body{padding:0 16px 16px}
  .shop{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--on-accent);background:var(--accent);padding:7px 12px;border-radius:999px;text-decoration:none}
  .fine{font-size:11px;color:#7d786c;line-height:1.5;margin-top:14px}
  .disclaimer-text{font-size:14px;line-height:1.6;color:#cfc9bb;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:42dvh;overflow:auto}
  .check-line{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:14px;line-height:1.5;cursor:pointer}
  .check-line input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto;margin-top:1px}
  .pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  select.field{appearance:none;-webkit-appearance:none}

  /* ---- Nutrition ---- */
  .targets{display:flex;align-items:center;gap:18px;margin-top:16px;flex-wrap:wrap}
  .kcal b{font-family:var(--display);font-size:44px;line-height:1;display:block;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .kcal small{color:var(--muted);font-size:12px}
  .macros{display:flex;gap:14px}
  .macros span{font-size:12px;color:var(--muted);display:flex;flex-direction:column}
  .macros b{font-size:18px;color:var(--text)}
  .shop-cta{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:linear-gradient(90deg,rgba(var(--accent-rgb),.14),transparent),var(--card);border:1px solid rgba(var(--accent-rgb),.45);border-radius:16px;padding:16px;margin-bottom:16px}
  .shop-cta b{display:block;font-size:16px}
  .shop-cta small{color:var(--muted);font-size:13px}
  .daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
  .dchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .dchip b{font-size:13px}
  .dchip small{font-size:11px;color:var(--muted);font-weight:700}
  .dchip.today{border-color:#3a382f}
  .dchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .dchip.on small{color:var(--on-accent)}
  .mb{margin:4px 0 10px}
  .mb-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
  .mb-top b{color:var(--text)} .mb-top small{color:var(--muted);font-weight:500}
  .mb-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .mb-bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .ing{list-style:none;display:flex;flex-direction:column;gap:6px}
  .ing li{font-size:14px;padding-left:16px;position:relative;line-height:1.45}
  .ing li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .shopbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
  .shopbar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
  .shop-row.on .name{text-decoration:line-through;color:var(--muted)}
  .ed-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .ed-week .field{padding:10px 4px;text-align:center}
  .tab{font-size:10.5px}

  /* ---- Meal photos ---- */
  .meal-hero{position:relative;display:flex;align-items:flex-end;justify-content:space-between;width:100%;height:170px;padding:16px;text-align:left;background-size:cover;background-position:center;border-radius:0}
  .meal-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,9,0) 25%,rgba(10,10,9,.88) 100%)}
  .meal-hero > *{position:relative}
  .meal-txt b{display:block;font-size:18px;line-height:1.2}
  .meal-txt small{display:block;color:#d8d2c4;font-size:13px;margin-top:3px}
  .meal-txt .slot{text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:11px;color:var(--accent);margin:0 0 4px}
  .day-head .meal-txt small{color:var(--muted)}
  .day-head .meal-txt .slot{color:var(--accent)}
  .meal-hero .chev{color:#fff;background:rgba(0,0,0,.35);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
  .day-card.meal.open .meal-hero .chev{transform:rotate(90deg);background:var(--accent);color:var(--on-accent)}
  .credit{font-size:11px;color:#7d786c;margin-top:12px}
  .credit a{color:#9d988b}
  .ed-photo{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
  .ed-photo img,.ph-empty{width:72px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--card-2)}
  .ph-empty{display:grid;place-items:center;font-size:10px;color:var(--muted);border:1px dashed #3a382f}
  .ph-btn{width:auto;padding:11px 12px;font-size:13px;flex:0 0 auto}

  /* ---- Injection tracker ---- */
  .inj{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:18px;padding:4px 16px 8px}
  .inj-head{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px}
  .inj-head b{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:20px}
  .inj-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .inj-row .name{font-weight:700;font-size:16px}
  .inj-status{font-size:13px;color:var(--muted);margin-top:3px}
  .inj-status .ok{color:var(--good);font-weight:600}
  .accent-t{color:var(--accent)}
  .inj-last{font-size:12px;color:#7d786c;margin-top:2px}
  .inj-btn{width:auto;padding:11px 18px;font-size:14px;flex:0 0 auto}
  .ov-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .ov{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:71;max-width:460px;margin:0 auto;background:var(--bg-2);border:1px solid var(--line);border-radius:22px;padding:24px 20px;max-height:88dvh;overflow:auto}
  .ov.full{top:calc(var(--safe-t) + 12px);bottom:calc(var(--safe-b) + 12px);transform:none;max-height:none}
  .ov-icon{font-size:40px;margin-bottom:8px}
  .ov-title{font-size:32px;margin:0 0 12px}
  .ov-p{line-height:1.55;margin-bottom:10px;font-size:16px}
  .ov-top{display:flex;justify-content:space-between;align-items:center}
  .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dp{padding:11px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
  .dp.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chipbtn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .sitepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sp{position:relative;text-align:left;padding:13px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
  .sp.on{border-color:var(--accent);background:linear-gradient(90deg,rgba(var(--accent-rgb),.14),transparent),var(--card)}
  .sp i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
  .bodymap{width:100%;max-width:400px;display:block;margin:14px auto 6px}
  .bodymap .fig *{fill:#1f1e1a;stroke:#3a382f;stroke-width:1}
  .bodymap .fig .seam{fill:none}
  .bodymap .fig .navel{fill:#3a382f;stroke:none}
  .bodymap .cap{fill:#7d786c;font-size:9px;text-anchor:middle;font-family:var(--body)}
  .bodymap .site circle{fill:#2b2a25;stroke:#4a4840;stroke-width:1}
  .bodymap .site.off{display:none}
  .bodymap .site.avail circle{fill:#3a382f;stroke:#6b675c}
  .bodymap .site.last circle{fill:#6b675c;stroke:#cfc9bb;stroke-width:2}
  .bodymap .site.next circle{fill:var(--accent);stroke:#ffd2b5;stroke-width:1.5}
  .bodymap .site.next .pulse{fill:rgba(var(--accent-rgb),.3);stroke:none;animation:pp 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pp{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
  .sitelist{display:flex;flex-direction:column;gap:8px}
  .sl{display:flex;align-items:center;gap:8px;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;text-align:left}
  .sl span{flex:1}
  .sl.on{border-color:var(--accent);background:linear-gradient(90deg,rgba(var(--accent-rgb),.16),transparent),var(--card)}
  .sl em{font-style:normal;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px}
  .tag-next{background:rgba(var(--accent-rgb),.16);color:var(--accent)}
  .tag-last{background:var(--card-2);color:var(--muted)}

  /* ---- Appearance ---- */
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
  .sw{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer}
  .sw span{width:44px;height:44px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line);transition:transform .15s}
  .sw.on span{border-color:var(--text);transform:scale(1.08)}
  .sw small{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .sw.on small{color:var(--text)}
  .sw .custom{display:grid;place-items:center;background:conic-gradient(#ff5f5f,#ffd25f,#5fff8a,#5fd2ff,#9a5fff,#ff5fd2,#ff5f5f);color:#fff;font-size:22px;font-weight:700}
  .sw input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg button{padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--accent);color:var(--on-accent)}

  /* ---- Badges ---- */
  .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
  .bdg b{font-size:13px;margin-top:4px}
  .bdg small{font-size:11px;color:var(--muted);line-height:1.3}
  .bdg:not(.on) b{color:var(--muted)}
  .bdg.on{border-color:rgba(var(--accent-rgb),.35)}
  .badge-svg.earned{filter:drop-shadow(0 6px 14px rgba(var(--accent-rgb),.35))}

  /* ---- Celebrations ---- */
  .cele{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:auto;animation:cIn .2s ease-out}
  .cele.out{animation:cOut .25s ease-in forwards}
  @keyframes cIn{from{opacity:0}to{opacity:1}} @keyframes cOut{to{opacity:0}}
  .cele:not(.badge-reveal){background:rgba(5,5,4,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .cele-core{position:relative;width:240px;height:240px;display:grid;place-items:center}
  .ring{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid var(--accent);animation:ringOut .9s cubic-bezier(.2,.7,.2,1) forwards;box-shadow:0 0 30px rgba(var(--accent-rgb),.6)}
  .ring.r2{border-color:var(--accent-2);animation-delay:.12s;opacity:0}
  @keyframes ringOut{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.1);opacity:0}}
  .sparks{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .sparks i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;opacity:0;animation:spark .85s cubic-bezier(.15,.75,.3,1) forwards;box-shadow:0 0 8px currentColor}
  @keyframes spark{0%{transform:rotate(var(--a)) translateX(0) scale(1);opacity:1}80%{opacity:1}100%{transform:rotate(var(--a)) translateX(var(--d)) scale(.2);opacity:0}}
  .cele-txt{position:relative;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) .08s both}
  .cele-txt b{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:40px;line-height:1;letter-spacing:.01em;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(var(--accent-rgb),.45))}
  .cele-txt small{display:block;margin-top:8px;font-size:14px;font-weight:700;color:var(--text);letter-spacing:.08em;text-transform:uppercase}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .badge-reveal{background:rgba(5,5,4,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .br-card{text-align:center;padding:24px;max-width:340px;width:100%}
  .br-kicker{font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);animation:pop .4s ease-out both}
  .br-medal{position:relative;width:180px;height:180px;margin:22px auto 8px;display:grid;place-items:center;animation:rise .7s cubic-bezier(.2,1.2,.3,1) .1s both}
  .br-medal svg{position:relative;z-index:1}
  .br-glow{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accent-rgb),.55),transparent 70%);filter:blur(14px);animation:glow 2.4s ease-in-out infinite}
  .br-shine{position:absolute;inset:15px;z-index:2;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;animation:shine 1.4s ease-out .7s both;mix-blend-mode:overlay}
  @keyframes rise{0%{transform:translateY(30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
  @keyframes glow{0%,100%{opacity:.7;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
  @keyframes shine{0%{background-position:150% 0}100%{background-position:-60% 0}}
  .br-name{font-size:44px;margin-top:6px;animation:pop .45s ease-out .35s both}
  .br-desc{color:var(--muted);font-size:15px;line-height:1.5;margin:10px 0 24px;animation:pop .45s ease-out .45s both}
  .br-card .btn{animation:pop .45s ease-out .55s both}
  @media (prefers-reduced-motion:reduce){.cele *,.cele{animation:none!important}}

  /* ---- Meal swap ---- */
  .swap-btn{margin-top:8px;font-size:13px;font-weight:700;color:var(--accent);padding:6px 0}
  .swapbox{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(var(--accent-rgb),.4);background:rgba(var(--accent-rgb),.06)}
  .swap-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:10px}
  .swap-actions .btn{padding:12px;font-size:14px}
  .spin.sm{width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:-3px;margin-right:6px;border-top-color:var(--on-accent)}
  .dislikes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .dislikes span{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--card-2);border:1px solid var(--line)}
  .dislikes button{width:20px;height:20px;border-radius:50%;color:var(--muted);font-size:11px}
  .center{min-height:70dvh;display:grid;place-items:center;text-align:center}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-140%);max-width:calc(100vw - 32px);z-index:60;background:var(--card-2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .25s}
  .toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app"><div class="center"><div class="spin"></div></div></div>
<div class="toast" id="toast"></div>

<script src="/app/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   DATA LAYER — talks to Supabase, or fakes it in demo mode
   ========================================================== */
const cfg = window.WT_CONFIG || {};
const DEMO = !cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('YOUR_') || !window.supabase;

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const TODAY = () => iso(new Date());

function makeSupabaseApi() {
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  const must = ({ data, error }) => { if (error) throw error; return data; };
  return {
    async user() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    // shouldCreateUser:false → only people you've added can log in
    async sendCode(email) { must(await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } })); },
    async verifyCode(email, token) { must(await sb.auth.verifyOtp({ email, token, type: 'email' })); },
    async signOut() { await sb.auth.signOut(); },
    async profile(uid) { return must(await sb.from('profiles').select('*').eq('id', uid).maybeSingle()); },
    async supplements() { return must(await sb.from('supplements').select('id,name,dose,timing,note,link,source,created_at').eq('archived', false).order('created_at')); },
    async addSupplement(name, dose) { return must(await sb.from('supplements').insert({ name, dose: dose || null }).select('id,name,dose,timing,note,link,source,created_at').single()); },
    async archiveSupplement(id) { must(await sb.from('supplements').update({ archived: true }).eq('id', id)); },
    async logs(from, to) { return must(await sb.from('supplement_logs').select('supplement_id,log_date').gte('log_date', from).lte('log_date', to)); },
    async setTaken(supplement_id, log_date, taken) {
      if (taken) must(await sb.from('supplement_logs').upsert({ supplement_id, log_date }, { onConflict: 'user_id,supplement_id,log_date', ignoreDuplicates: true }));
      else must(await sb.from('supplement_logs').delete().eq('supplement_id', supplement_id).eq('log_date', log_date));
    },
    // ---- Program ----
    async intake(uid) { return must(await sb.from('intakes').select('answers,created_at').eq('user_id', uid).order('created_at', { ascending: false }).limit(1).maybeSingle()); },
    async program(uid) { return must(await sb.from('programs').select('id,title,data,published_at').eq('user_id', uid).eq('status', 'published').order('published_at', { ascending: false }).limit(1).maybeSingle()); },
    async submitIntake(answers) { must(await sb.from('intakes').insert({ answers })); },
    async callDraft(body, keepalive) {
      const { data } = await sb.auth.getSession();
      const res = await fetch('/api/generate-program', { method: 'POST', keepalive, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify(body || {}) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || 'Draft failed');
      return out;
    },
    requestDraft() { this.callDraft({}, false).catch(() => {}); },
    // ---- Coach ----
    async coachClients() { return must(await sb.from('profiles').select('id,email,full_name,tier,active,is_coach').order('created_at', { ascending: false })); },
    async coachPrograms() { return must(await sb.from('programs').select('id,user_id,status,title,data,ai_notes,error,published_at,updated_at').neq('status', 'archived').order('created_at', { ascending: false })); },
    async coachIntakes() { return must(await sb.from('intakes').select('user_id,answers,created_at').order('created_at', { ascending: false })); },
    async generateDraft(user_id, instructions) { return this.callDraft({ user_id, instructions }); },
    async coachSaveDraft(id, data) { must(await sb.from('programs').update({ data, title: data.title || null, updated_at: new Date().toISOString() }).eq('id', id)); },
    async coachCreateDraft(user_id, data) { must(await sb.from('programs').insert({ user_id, status: 'draft', data, title: data?.title || null })); },
    async coachPublish(id, user_id, data) {
      must(await sb.from('programs').update({ status: 'archived' }).eq('user_id', user_id).eq('status', 'published'));
      must(await sb.from('programs').update({ status: 'published', data, title: data.title || null, ai_notes: null, published_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id));
    },
    // ---- Supplement protocols ----
    async suppIntake(uid) { return must(await sb.from('supp_intakes').select('answers,created_at').eq('user_id', uid).order('created_at', { ascending: false }).limit(1).maybeSingle()); },
    async protocol(uid) { return must(await sb.from('protocols').select('id,data,acknowledged_at,published_at').eq('user_id', uid).eq('status', 'published').order('published_at', { ascending: false }).limit(1).maybeSingle()); },
    async submitSuppIntake(answers) { must(await sb.from('supp_intakes').insert({ answers })); },
    async callProtocol(body, keepalive) {
      const { data } = await sb.auth.getSession();
      const res = await fetch('/api/generate-protocol', { method: 'POST', keepalive, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify(body || {}) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || 'Generating failed');
      return out;
    },
    requestProtocol() { this.callProtocol({}, false).catch(() => {}); },
    async ackProtocol(id) { must(await sb.rpc('acknowledge_protocol', { protocol_id: id })); },
    async coachSuppIntakes() { return must(await sb.from('supp_intakes').select('user_id,answers,created_at').order('created_at', { ascending: false })); },
    async coachProtocols() { return must(await sb.from('protocols').select('id,user_id,status,data,ai_notes,error,acknowledged_at,published_at').neq('status', 'archived').order('created_at', { ascending: false })); },
    async generateProtocol(user_id, instructions) { return this.callProtocol({ user_id, instructions }); },
    async coachSaveProtocol(id, data) { must(await sb.from('protocols').update({ data, updated_at: new Date().toISOString() }).eq('id', id)); },
    async coachCreateProtocolDraft(user_id, data) { must(await sb.from('protocols').insert({ user_id, status: 'draft', data })); },
    async coachPublishProtocol(id, user_id, data) {
      const existing = must(await sb.from('supplements').select('id,name').eq('user_id', user_id).eq('archived', false));
      const plan = mergePlan(existing || [], data.items);
      for (const u of plan.updates) { const { id: sid, ...f } = u; must(await sb.from('supplements').update(f).eq('id', sid)); }
      if (plan.inserts.length) must(await sb.from('supplements').insert(plan.inserts.map(x => ({ ...x, user_id }))));
      must(await sb.from('protocols').update({ status: 'archived' }).eq('user_id', user_id).eq('status', 'published'));
      must(await sb.from('protocols').update({ status: 'published', data, ai_notes: null, acknowledged_at: null, published_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id));
      return { added: plan.inserts.length, updated: plan.updates.length };
    },
    // ---- Nutrition ----
    async nutIntake(uid) { return must(await sb.from('nutrition_intakes').select('answers,created_at').eq('user_id', uid).order('created_at', { ascending: false }).limit(1).maybeSingle()); },
    async mealPlan(uid) { return must(await sb.from('meal_plans').select('id,data,published_at').eq('user_id', uid).eq('status', 'published').order('published_at', { ascending: false }).limit(1).maybeSingle()); },
    async submitNutIntake(answers) { must(await sb.from('nutrition_intakes').insert({ answers })); },
    async callMealPlan(body) {
      const { data } = await sb.auth.getSession();
      const res = await fetch('/api/generate-mealplan', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify(body || {}) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || 'Generating failed');
      return out;
    },
    requestMealPlan() { this.callMealPlan({}).catch(() => {}); },
    async shopProgress(planId) { const r = must(await sb.from('shopping_progress').select('checked').eq('plan_id', planId).maybeSingle()); return r?.checked || []; },
    async saveShopProgress(planId, checked) { must(await sb.from('shopping_progress').upsert({ plan_id: planId, checked, updated_at: new Date().toISOString() }, { onConflict: 'plan_id,user_id' })); },
    async coachNutIntakes() { return must(await sb.from('nutrition_intakes').select('user_id,answers,created_at').order('created_at', { ascending: false })); },
    async coachMealPlans() { return must(await sb.from('meal_plans').select('id,user_id,status,data,ai_notes,error,published_at').neq('status', 'archived').order('created_at', { ascending: false })); },
    async generateMealPlan(user_id, instructions) { return this.callMealPlan({ user_id, instructions }); },
    async coachSaveMealPlan(id, data) { must(await sb.from('meal_plans').update({ data, updated_at: new Date().toISOString() }).eq('id', id)); },
    async swapMeal(user_id, plan, ti, mi, notes) {
      const { data } = await sb.auth.getSession();
      const res = await fetch('/api/swap-meal', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ user_id, plan, ti, mi, notes }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || 'Swap failed. Try again.');
      return out;
    },
    async coachResetNutrition(user_id) {
      must(await sb.from('meal_plans').update({ status: 'archived' }).eq('user_id', user_id).in('status', ['flagged', 'failed', 'draft', 'generating']));
      must(await sb.from('nutrition_intakes').delete().eq('user_id', user_id));
    },
    async mealPhotos(items) {
      const { data } = await sb.auth.getSession();
      const res = await fetch('/api/meal-photo', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ items }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || 'Photo search failed');
      return out.photos || [];
    },
    async coachCreateMealPlanDraft(user_id, data) { must(await sb.from('meal_plans').insert({ user_id, status: 'draft', data })); },
    // ---- Badges ----
    async badges() { return must(await sb.from('user_badges').select('badge_id,earned_at')); },

};
const hexRgb = h => { const m = String(h).replace('#', '').match(/^([0-9a-f]{6})$/i); if (!m) return null; const n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const lum = ([r, g, b]) => { const f = c => { c /= 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
function lighten(hex, amt) { const c = hexRgb(hex); if (!c) return hex; return '#' + c.map(v => Math.round(v + (255 - v) * amt).toString(16).padStart(2, '0')).join(''); }

  if (t && t.startsWith('#')) return { a: t, b: lighten(t, .45) };   // custom color
  const p = THEMES.find(x => x.id === t) || THEMES[0]; return { a: p.a, b: p.b };
}
function applyTheme(theme, bg) {
  const { a, b } = themeColors(theme || 'ember'), ra = hexRgb(a) || [255, 106, 26], rb = hexRgb(b) || ra;
  const r = document.documentElement.style;
  r.setProperty('--accent', a); r.setProperty('--accent-2', b);
  r.setProperty('--accent-rgb', ra.join(',')); r.setProperty('--accent2-rgb', rb.join(','));
  r.setProperty('--on-accent', lum(ra) < .32 ? '#ffffff' : '#120800');
  const vars = BGS[bg] || BGS.dark; Object.entries(vars).forEach(([k, v]) => r.setProperty(k, v));
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', vars['--bg']);
}

/* ---------- Login ---------- */
function renderLogin(errMsg = '') {
  const codeStep = S.loginStep === 'code';
  $app.innerHTML = `
    ${demoBar()}
    <div class="login">
      <div class="logo">W</div>
      <h1 class="display">Lock <span class="accent">In.</span></h1>
      ${codeStep
        ? `<p>We sent a 6-digit code to <b style="color:var(--text)">${esc(S.loginEmail)}</b>. Enter it below.</p>
           <input class="field code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" />
           <button class="btn btn-primary" id="go">Log In</button>
           <button class="btn btn-ghost" id="back">Use a different email</button>`
        : `${S.welcome ? `<div class="demo" style="color:var(--good);border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.08)">Payment received. Welcome to the team.</div>` : ''}
           <p>${S.welcome ? 'Log in with the <b style="color:var(--text)">same email you just paid with</b> and we\'ll send you a login code.' : 'Client login. Enter the email you signed up with and we\'ll send you a login code.'}</p>
           <input class="field" id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" value="${esc(S.loginEmail)}" />
           <button class="btn btn-primary" id="go">Send My Code</button>
           <p style="font-size:13px;text-align:center;margin:6px 0 0">Not a client yet? <a href="/#apply" style="color:var(--accent);font-weight:700">Apply here</a></p>`}
      <div class="err" id="err">${esc(errMsg)}</div>
    </div>`;
  const go = document.getElementById('go');
  if (codeStep) {
    const input = document.getElementById('code'); input.focus();
    document.getElementById('back').onclick = () => { S.loginStep = 'email'; renderLogin(); };
    const submit = async () => {
      const code = input.value.trim();
      if (!/^\d{6}$/.test(code)) return renderErr('Enter the 6-digit code from your email.');
      go.disabled = true; go.textContent = 'Checking…';
      try { await api.verifyCode(S.loginEmail, code); await boot(); }
      catch (e) { go.disabled = false; go.textContent = 'Log In'; renderErr('That code didn\'t work. Check it or request a new one.'); }
    };
    go.onclick = submit; input.oninput = () => { if (input.value.length === 6) submit(); };
  } else {
    const input = document.getElementById('email');
    const submit = async () => {
      const email = input.value.trim().toLowerCase();
      if (!/^\S+@\S+\.\S+$/.test(email)) return renderErr('Enter a valid email.');
      go.disabled = true; go.textContent = 'Sending…';
      try { await api.sendCode(email); S.loginEmail = email; S.loginStep = 'code'; renderLogin(); }
      catch (e) {
        go.disabled = false; go.textContent = 'Send My Code';
        const notListed = /not allowed|signups|not found/i.test(e.message || '');
        renderErr(notListed
          ? (S.welcome ? 'Your account is still being set up. Wait 30 seconds, then tap Send My Code again.' : 'That email isn\'t on the client list yet. Apply first or contact Zane.')
          : 'Couldn\'t send the code. Try again in a minute.');
      }
    };
    go.onclick = submit; input.onkeydown = e => { if (e.key === 'Enter') submit(); };
  }
}

function viewToday() {
  if (Q.on && Q.kind === 'supps') return viewQuestion();

  const d = S.date, total = S.sups.length;
  const done = S.sups.filter(s => S.logs.has(key(s.id, d))).length;
  const pct = total ? done / total : 0, C = 2 * Math.PI * 42;
  const allDone = total && done === total;
  const msg = !total ? 'Add your supplements to start' : allDone ? 'All done. That\'s locking in.' : `${total - done} left to take`;

        </svg>

      </div>
    </div>
    ${injectionsCard()}
    ${protocolCard()}
    <div class="sec"><h2>Supplements</h2><button class="link" id="edit">${total ? 'Edit' : '+ Add'}</button></div>
    <div class="list">
      ${total ? S.sups.slice().sort((a, b) => timingIdx(a.timing) - timingIdx(b.timing)).map(s => {
        const on = S.logs.has(key(s.id, d));

function bindToday() {
  if (S.tab !== 'today') return;
  if (Q.on && Q.kind === 'supps') return bindQuestion();
  bindProtocolClient();

  document.getElementById('prev').onclick = () => { S.date = addDays(S.date, -1); renderShell(); };

const Q = { on: false, i: 0, a: {}, kind: 'training', set: QUESTIONS, submit: null };
function startQuestions(kind, set, submit) { Object.assign(Q, { on: true, i: 0, a: {}, kind, set, submit }); renderShell(); window.scrollTo(0, 0); }

function viewProgram() {

function viewQuestion() {
  const q = Q.set[Q.i], v = Q.a[q.k], last = Q.i === Q.set.length - 1;
  let input = '';
  if (q.type === 'choice') input = `<div class="opts">${q.opts.map(o => `<button class="opt ${v === o ? 'on' : ''}" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  if (q.type === 'multi') input = `<div class="opts">${q.opts.map(o => `<button class="opt ${(v || []).includes(o) ? 'on' : ''}" data-multi="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  if (q.type === 'number' || q.type === 'text') input = `<input class="field" id="qIn" ${q.type === 'number' ? 'inputmode="decimal"' : ''} placeholder="${esc(q.ph || '')}" value="${esc(v || '')}" />`;
  if (q.type === 'textarea') input = `<textarea class="field" id="qIn" rows="4" placeholder="${esc(q.ph || '')}">${esc(v || '')}</textarea>`;
  const needsNext = q.type !== 'choice';
  return `
    <div class="qbar"><div style="width:${((Q.i + 1) / Q.set.length) * 100}%"></div></div>
    <div class="qhead"><button class="link" id="qBack">${Q.i ? '‹ Back' : '✕ Cancel'}</button><span class="muted" style="font-size:13px">${Q.i + 1} of ${Q.set.length}</span></div>
    <h2 class="qtitle">${esc(q.q)}</h2>${q.sub ? `<p class="muted" style="margin:-6px 0 14px">${esc(q.sub)}</p>` : ''}
    ${input}
    ${needsNext || last ? `<button class="btn btn-primary" id="qNext" style="margin-top:18px">${last ? 'Submit' : 'Next'}</button>` : ''}
    ${q.optional ? `<button class="btn" id="qSkip" style="margin-top:6px;color:var(--muted)">Skip</button>` : ''}
    <div class="err" id="err"></div>`;
}

function bindProgram() {
  if (S.tab !== 'program') return;
  const start = document.getElementById('qStart');
  if (start) start.onclick = () => startQuestions('training', QUESTIONS, submitIntake);
  if (Q.on && Q.kind === 'training') bindQuestion(); else bindPublished();
}

function bindQuestion() {
  const q = Q.set[Q.i], n = Q.set.length;
  const go = (dir) => { Q.i += dir; renderShell(); window.scrollTo(0, 0); setTimeout(() => document.getElementById('qIn')?.focus(), 50); };
  document.getElementById('qBack').onclick = () => { if (Q.i === 0) { Q.on = false; renderShell(); } else go(-1); };
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    Q.a[q.k] = b.dataset.opt;
    if (Q.i === n - 1) renderShell(); else go(1);
  });
  document.querySelectorAll('[data-multi]').forEach(b => b.onclick = () => {
    const cur = Q.a[q.k] || [], o = b.dataset.multi;
    if (cur.includes(o)) Q.a[q.k] = cur.filter(x => x !== o);
    else if (cur.length < (q.max || 99)) Q.a[q.k] = [...cur, o];
    else return toast(`Pick up to ${q.max}`);
    renderShell();
  });
  const input = document.getElementById('qIn');
  if (input) { input.oninput = () => { Q.a[q.k] = input.value; }; if (input.tagName === 'INPUT') input.onkeydown = e => { if (e.key === 'Enter') document.getElementById('qNext')?.click(); }; }
  const skip = document.getElementById('qSkip');
  if (skip) skip.onclick = () => { delete Q.a[q.k]; Q.i === n - 1 ? Q.submit() : go(1); };
  const next = document.getElementById('qNext');
  if (next) next.onclick = () => {
    const v = Q.a[q.k];
    const empty = v == null || (Array.isArray(v) ? !v.length : !String(v).trim());
    if (empty && !q.optional) return renderErr('Answer this one to continue.');
    if (q.k === 'age' && !(Number(v) >= 13 && Number(v) <= 99)) return renderErr('Enter your age in years.');
    Q.i === n - 1 ? Q.submit() : go(1);
  };
}

async function submitIntake() {
  const btn = document.getElementById('qNext'); if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
  try {
    const answers = { ...Q.a };
    await api.submitIntake(answers);
    S.intake = { answers };
    Q.on = false;
    api.requestDraft(); // AI drafts in the background; the coach approves before the client sees it
    renderShell(); window.scrollTo(0, 0);
    toast('Submitted. Zane is on it.');
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
    renderErr("Couldn't submit. Check your connection and try again.");
  }
}

function clientStatus(c) {
  const ps = C.programs[c.id] || [];
  const latest = ps[0];
  if (latest?.status === 'generating') return ['Drafting…', 'warn'];
  if (latest?.status === 'failed') return ['Draft failed', 'bad'];
  if (ps.some(p => p.status === 'draft')) return ['Review draft', 'hot'];
  if (ps.some(p => p.status === 'published')) return ['Published', 'good'];
  if (C.intakes[c.id]) return ['Needs draft', 'hot'];
  return ['No questionnaire', ''];
}
async function loadCoach() {

  C.protocols = {}; (protocols || []).forEach(p => (C.protocols[p.user_id] ||= []).push(p));
  const [mealPlans, nutIntakes] = await Promise.all([api.coachMealPlans().catch(() => []), api.coachNutIntakes().catch(() => [])]);

function setPath(obj, path, val) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  const last = ks[ks.length - 1];
  o[last] = (last === 'sets' || last === 'duration_weeks') ? (val === '' ? '' : (Number(val) || val)) : val;
}

function stopPoll() { if (C.poll) { clearInterval(C.poll); C.poll = null; } }
function startPoll() {
  stopPoll(); let n = 0;
  C.poll = setInterval(async () => {
    n++;
    try { await loadCoach(); } catch (e) {}
    const d = (C.programs[C.sel] || []).find(p => ['draft', 'generating', 'failed'].includes(p.status));
    const sd = (C.protocols[C.sel] || []).find(p => ['draft', 'generating', 'failed'].includes(p.status));
    const md = (C.mealPlans[C.sel] || []).find(p => ['draft', 'generating', 'failed'].includes(p.status));
    const busy = d?.status === 'generating' || sd?.status === 'generating' || md?.status === 'generating';
    if (!busy || n > 60) { stopPoll(); C.edit = C.edit || (d?.data ? structuredClone(d.data) : null); C.sedit = C.sedit || (sd?.data ? structuredClone(sd.data) : null); C.nedit = C.nedit || (md?.status === 'draft' && md.data ? structuredClone(md.data) : null); }
    if (S.tab === 'coach') renderShell();
  }, 5000);
}

async function generate(instructions) {
  const c = C.sel;
  (C.programs[c] ||= []);
  const d = C.programs[c].find(p => ['draft', 'failed'].includes(p.status));
  if (d) d.status = 'generating'; else C.programs[c].unshift({ user_id: c, status: 'generating' });
  renderShell(); startPoll();
  try {
    await api.generateDraft(c, instructions);
    await loadCoach();
    const nd = (C.programs[c] || []).find(p => p.status === 'draft');
    C.edit = nd?.data ? structuredClone(nd.data) : null;
    stopPoll(); renderShell(); toast('Program ready to review');
  } catch (e) {
    stopPoll(); await loadCoach().catch(() => {}); renderShell();
    toast(e.message || 'Draft failed');
  }
}

function bindCoach() {
  if (S.tab !== 'coach') return;

    $('cRefresh') && ($('cRefresh').onclick = async () => { C.loaded = false; renderShell(); await loadCoach(); renderShell(); });

      renderShell(); window.scrollTo(0, 0);
    });

  $('cBack').onclick = () => { stopPoll(); C.sel = null; C.edit = null; C.sedit = null; C.nedit = null; C.swapOpen = null; renderShell(); };
  bindCoachSupps(); bindCoachNutrition();
  $('cGen') && ($('cGen').onclick = () => generate(''));

  document.querySelectorAll('[data-delex]').forEach(b => b.onclick = () => { const [d, x] = b.dataset.delex.split('.').map(Number); C.edit.days[d].exercises.splice(x, 1); re(); });
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
    const [d, x, dir] = b.dataset.mv.split('.').map(Number), arr = C.edit.days[d].exercises, y = x + dir;
    if (y < 0 || y >= arr.length) return; [arr[x], arr[y]] = [arr[y], arr[x]]; re();

  document.querySelectorAll('[data-delday]').forEach(b => b.onclick = () => { if (confirm('Remove this whole day?')) { C.edit.days.splice(+b.dataset.delday, 1); re(); } });
  $('cAddDay') && ($('cAddDay').onclick = () => { (C.edit.days ||= []).push({ name: `Day ${C.edit.days.length + 1}`, focus: '', warmup: '', exercises: [blankEx()] }); re(); });

  $('cSave') && ($('cSave').onclick = async () => {

  $('cPublish') && ($('cPublish').onclick = async () => {
    const data = clean();

    catch (e) { toast("Couldn't publish: " + (e.message || 'unknown error')); }
  });
  $('cRegen') && ($('cRegen').onclick = async () => {
    const instr = $('cInstr').value.trim();

}

async function generateProtocol(instructions) {
  const c = C.sel; (C.protocols[c] ||= []);
  const d = C.protocols[c].find(p => ['draft', 'failed'].includes(p.status));
  if (d) d.status = 'generating'; else C.protocols[c].unshift({ user_id: c, status: 'generating' });
  renderShell(); startPoll();
  try {
    await api.generateProtocol(c, instructions);
    await loadCoach();
    const nd = (C.protocols[c] || []).find(p => p.status === 'draft');
    C.sedit = nd?.data ? structuredClone(nd.data) : null;
    stopPoll(); renderShell(); toast('Protocol ready to review');
  } catch (e) { stopPoll(); await loadCoach().catch(() => {}); renderShell(); toast(e.message || 'Generating failed'); }
}
function bindCoachSupps() {
  const $ = id => document.getElementById(id);
  $('sGen') && ($('sGen').onclick = () => generateProtocol(''));
  $('sEditPub') && ($('sEditPub').onclick = async () => {

    try { const r = await api.coachPublishProtocol(draftRow().id, C.sel, data); await loadCoach(); C.sedit = null; renderShell(); toast(`Published: ${r.added} added, ${r.updated} updated`); }
    catch (e) { console.error(e); toast("Couldn't publish: " + (e.message || e.details || 'unknown error')); }
  });
  $('sRegen') && ($('sRegen').onclick = async () => {
    const instr = $('sInstr').value.trim(); if (!instr) return toast('Type what you want changed');
    try { await api.coachSaveProtocol(draftRow().id, clean()); } catch (e) {}
    generateProtocol(instr);
  });
}

// Merge a published protocol into a client's supplement list without duplicates.
function mergePlan(existing, items) {
  const updates = [], inserts = [];
  for (const it of items) {
    const match = existing.find(e => sameSupp(e.name, it.name));
    const fields = { dose: it.dose || null, timing: it.timing || null, note: it.purpose || null, link: safeLink(it.link) || null, source: 'protocol' };
    if (match) updates.push({ id: match.id, ...fields });
    else inserts.push({ name: it.name, ...fields });
  }
  return { updates, inserts };
}

const sameDay = (a, b) => iso(new Date(a)) === iso(b);
const timeStr = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function whenStr(t) {
  const d = new Date(t), today = new Date(), y = new Date(); y.setDate(y.getDate() - 1);
  if (sameDay(d, today)) return `today ${timeStr(d)}`;
  if (sameDay(d, y)) return `yesterday ${timeStr(d)}`;
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + timeStr(d);
}
function daysLabel(days) {
  if (!days || !days.length) return 'As needed';
  if (days.length === 7) return 'Every day';
  return days.slice().sort((a, b) => a - b).map(d => DAY_SHORT[d]).join(', ');
}
function nextDueLabel(c) {
  if (!c.days?.length) return '';
  for (let k = 1; k <= 7; k++) { const d = (dowIdx() + k) % 7; if (c.days.includes(d)) return k === 1 ? 'tomorrow' : DAY_SHORT[d]; }
  return '';
}

/* ---------- Body map ---------- */
function bodyMap(sites, next, last) {
  const dot = (s) => {
    const [x, y] = SITE_XY[s] || []; if (x == null) return '';
    const cls = s === next ? 'next' : s === last ? 'last' : sites.includes(s) ? 'avail' : 'off';
    return `<g class="site ${cls}">${s === next ? `<circle cx="${x}" cy="${y}" r="12" class="pulse"/>` : ''}<circle cx="${x}" cy="${y}" r="7"/></g>`;
  };
  const fig = (ox, back) => `<g transform="translate(${ox},0)" class="fig">
      <circle cx="50" cy="16" r="10"/>
      <path d="M28 32 Q50 25 72 32 L79 70 Q77 98 72 114 L28 114 Q23 98 21 70 Z"/>
      <path d="M28 33 L14 78 L20 80 L33 46 Z"/><path d="M72 33 L86 78 L80 80 L67 46 Z"/>
      <path d="M30 112 L49 112 L47 188 L37 188 Z"/><path d="M51 112 L70 112 L63 188 L53 188 Z"/>
      ${back ? '<path d="M36 102 Q50 126 64 102" class="seam"/>' : '<circle cx="50" cy="80" r="1.8" class="navel"/>'}
    </g>`;
  return `<svg viewBox="0 0 220 196" class="bodymap" aria-hidden="true">
    ${fig(0, false)}${fig(120, true)}
    <text x="50" y="195" class="cap">Front</text><text x="170" y="195" class="cap">Back</text>
    ${SITES.map(dot).join('')}
  </svg>`;
}

}

/* ----- Celebration queue (so a day close-out and a badge don't collide) ----- */
const CQ = { list: [], busy: false };
function queueCelebration(c) { CQ.list.push(c); if (!CQ.busy) nextCelebration(); }
function nextCelebration() {
  const c = CQ.list.shift(); if (!c) { CQ.busy = false; return; }
  CQ.busy = true;
  if (c.type === 'day') showBurst('Day locked in', c.sub, 1900);
  else if (c.type === 'shop') showBurst('Stocked up', 'Go prep and lock in', 1600);
  else if (c.type === 'badge') showBadge(c.badge);
}
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function sparks(n = 26) {
  let h = '';
  for (let i = 0; i < n; i++) {
    const ang = (360 / n) * i + (Math.random() * 10 - 5), dist = 90 + Math.random() * 80, sz = 3 + Math.random() * 4;
    const col = ['var(--accent)', 'var(--accent-2)', '#ffffff'][i % 3];
    h += `<i style="--a:${ang}deg;--d:${dist}px;--s:${sz}px;background:${col};animation-delay:${Math.random() * 80}ms"></i>`;
  }
  return `<div class="sparks">${h}</div>`;
}
function showBurst(title, sub, ms) {
  const el = document.createElement('div');
  el.className = 'cele';
  el.innerHTML = `<div class="cele-core">${reduceMotion() ? '' : '<div class="ring"></div><div class="ring r2"></div>' + sparks()}
    <div class="cele-txt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div></div>`;
  document.body.appendChild(el);
  if (navigator.vibrate) navigator.vibrate([12, 40, 18]);
  const done = () => { if (!el.isConnected) return; el.classList.add('out'); setTimeout(() => { el.remove(); nextCelebration(); }, 250); };
  el.onclick = done; setTimeout(done, ms);
}
function showBadge(b) {
  if (!b) return nextCelebration();
  const el = document.createElement('div');
  el.className = 'cele badge-reveal';
  el.innerHTML = `<div class="br-card">
      <div class="br-kicker">Badge unlocked</div>
      <div class="br-medal">${reduceMotion() ? '' : sparks(20)}<div class="br-glow"></div>${badgeSvg(b, true, 150)}<div class="br-shine"></div></div>
      <div class="display br-name">${esc(b.name)}</div>
      <p class="br-desc">${esc(b.desc)}</p>
      <button class="btn btn-primary" id="brGo">Let's go</button>
    </div>`;
  document.body.appendChild(el);
  if (navigator.vibrate) navigator.vibrate([20, 60, 30, 60, 40]);
  const done = () => { el.classList.add('out'); setTimeout(() => { el.remove(); nextCelebration(); }, 250); };
  el.querySelector('#brGo').onclick = done;
}

/* ----- Hooks called from Today / Shopping ----- */
async function onSupplementToggled(wasAllDone) {
  const total = S.sups.length;
  if (!total || S.date !== TODAY()) return;
  const allDone = S.sups.every(s => S.logs.has(key(s.id, S.date)));
  if (!allDone || wasAllDone) return;
  queueCelebration({ type: 'day', sub: S.streak > 1 ? `${S.streak} day streak` : 'First full day' });
  await award('day_one');
  for (const id of badgesFor(S.streak)) await award(id);
}
async function onShoppingDone() {
  queueCelebration({ type: 'shop' });
  await award('stocked');
}

/* ----- Me tab ----- */
function badgesCard() {
  const got = earnedMap(), count = BADGES.filter(b => got[b.id]).length;
  return `<div class="card"><div class="k" style="display:flex;justify-content:space-between"><span>Badges</span><span>${count} / ${BADGES.length}</span></div>
    <div class="badge-grid">${BADGES.map(b => `<button class="bdg ${got[b.id] ? 'on' : ''}" data-badge="${b.id}">
        ${badgeSvg(b, !!got[b.id], 64)}<b>${esc(b.name)}</b><small>${got[b.id] ? new Date(got[b.id]).toLocaleDateString([], { month: 'short', day: 'numeric' }) : esc(b.req)}</small></button>`).join('')}</div></div>`;
}
function bindBadges() {
  document.querySelectorAll('[data-badge]').forEach(el => el.onclick = () => {
    const b = BADGES.find(x => x.id === el.dataset.badge), got = earnedMap()[b.id];
    if (got) queueCelebration({ type: 'badge', badge: b });
    else toast(`${b.name}: ${b.req}`);
  });
}

/* ---------- Me ---------- */
function viewMe() {
  const p = S.profile;
  return `
    <div class="card"><div class="k">Name</div><div class="v">${esc(p.full_name || '—')}</div></div>
    <div class="card"><div class="k">Email</div><div class="v">${esc(p.email || S.user.email)}</div></div>
    <div class="card"><div class="k">Plan</div><div class="v">${p.tier === 'transformation' ? 'Transformation Coaching' : p.tier === 'fitness' ? 'Fitness Coaching' : 'Member'}</div></div>
    ${badgesCard()}
    ${appearanceCard()}
    ${S.pepReady && !(Number(S.intake?.answers?.age) < 18) ? meInjectionCard() : ''}
    ${cfg.BILLING_PORTAL_URL ? `<a class="btn btn-ghost" style="margin-top:14px" href="${esc(cfg.BILLING_PORTAL_URL)}" target="_blank" rel="noopener">Manage Billing</a>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:8px">Update your card or cancel. Log in with ${esc(p.email || S.user.email)}.</p>` : ''}
    <button class="btn btn-ghost" id="out" style="margin-top:14px">Sign Out</button>`;
}
function bindMe() { const b = document.getElementById('out'); if (b && S.tab === 'me') b.onclick = signOut; if (S.tab === 'me') { bindAppearance(); bindBadges(); } }
async function signOut() { await api.signOut(); stopPoll(); S.user = null; S.tab = 'today'; S.intake = S.program = S.suppIntake = S.protocol = S.nutIntake = S.mealPlan = null; N.loadedFor = null; N.checked = new Set(); N.view = 'plan'; S.settings = null; S.compounds = []; S.injLogs = []; S.overlay = null; S.badges = []; document.body.style.overflow = ''; Q.on = false; C.loaded = false; C.sel = null; S.loginStep = 'email'; sheetOpen = false; $app.classList.remove('wide'); renderLogin(); }

/* ---------- Streak ---------- */
function computeStreak() {
  if (!S.sups.length) { S.streak = 0; return; }
  // A supplement only counts toward days on/after the day it was added, so new items don't break an old streak.
  const added = s => s.created_at ? iso(new Date(s.created_at)) : '0000-00-00';
  const full = d => { const due = S.sups.filter(s => added(s) <= d); return due.length > 0 && due.every(s => S.logs.has(key(s.id, d))); };
  let d = TODAY(); if (!full(d)) d = addDays(d, -1);   // today not finished yet doesn't break it
  let n = 0; while (full(d) && n < 365) { n++; d = addDays(d, -1); }
  S.streak = n;
}

/* ---------- iPhone "Add to Home Screen" hint ---------- */
function maybeInstallHint() {
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let dismissed = false; try { dismissed = localStorage.getItem('wt-install-hint') === '1'; } catch (e) {}
  if (!ios || standalone || dismissed || document.getElementById('install')) return;
  const el = document.createElement('div'); el.className = 'install'; el.id = 'install';
  el.innerHTML = `<b>Get the app:</b> tap the Share button <span style="font-size:16px">⬆︎</span> at the bottom of Safari, then <b>Add to Home Screen</b>.<button class="x" aria-label="Dismiss">×</button>`;
  el.querySelector('.x').onclick = () => { el.remove(); try { localStorage.setItem('wt-install-hint', '1'); } catch (e) {} };
  document.body.appendChild(el);
}

/* ---------- Start ---------- */
async function loadData() {
  const [sups, logs, intake, program] = await Promise.all([
    api.supplements(), api.logs(addDays(TODAY(), -120), TODAY()),
    api.intake(S.user.id).catch(() => null), api.program(S.user.id).catch(() => null)
  ]);
  S.intake = intake; S.program = program;
  [S.suppIntake, S.protocol] = await Promise.all([api.suppIntake(S.user.id).catch(() => null), api.protocol(S.user.id).catch(() => null)]);
  [S.nutIntake, S.mealPlan] = await Promise.all([api.nutIntake(S.user.id).catch(() => null), api.mealPlan(S.user.id).catch(() => null)]);
  try {
    const [st, cs, lg] = await Promise.all([api.settings(), api.compounds(), api.injLogs()]);
    S.settings = st; S.compounds = cs || []; S.injLogs = lg || []; S.pepReady = true;
  } catch (e) { S.pepReady = false; } // tracker tables not set up yet → hide the feature
  try { S.badges = await api.badges() || []; }
  catch (e) { try { S.badges = JSON.parse(localStorage.getItem('wt-badges-' + S.user.id) || '[]'); } catch (_) { S.badges = []; } }
  // Self-heal: if they submitted a questionnaire but nothing's published yet, nudge the server.
  // (The server skips this if a draft already exists or is in progress, so it never double-drafts.)
  if (!DEMO) {
    if (S.intake && !S.program) api.requestDraft();
    if (S.suppIntake && !S.protocol) api.requestProtocol();
    if (S.nutIntake && !S.mealPlan) api.requestMealPlan();
  }
  S.sups = sups || [];
  S.logs = new Set((logs || []).map(l => key(l.supplement_id, l.log_date)));
  computeStreak();
}
async function boot() {
  try {
    S.user = await api.user();
    if (!S.user) return renderLogin();
    S.profile = (await api.profile(S.user.id)) || { active: false };
    if (!S.profile.active) return renderInactive();
    if (S.welcome) { S.welcome = false; history.replaceState(null, '', '/app/'); }
    await loadData();
    backfillBadges().catch(() => {});
    if (S.settings?.theme) { const lt = localTheme(); if (lt.theme !== S.settings.theme || lt.bg !== S.settings.theme_bg) { applyTheme(S.settings.theme, S.settings.theme_bg); try { localStorage.setItem('wt-theme', JSON.stringify({ theme: S.settings.theme, bg: S.settings.theme_bg || 'dark' })); } catch (e) {} } }
    const age = Number(S.intake?.answers?.age);
    if (S.pepReady && !S.settings?.peptides_answered && !(age && age < 18)) S.overlay = 'pep-ask';
    renderShell();
  } catch (e) {
    console.error(e);
    $app.innerHTML = `<div class="soon"><div class="display">Connection <span class="accent">Issue.</span></div><p>Couldn't reach the server. Check your internet and try again.</p><button class="btn btn-primary" style="margin-top:22px" onclick="location.reload()">Retry</button></div>`;
  }
}
// Refresh when the app comes back to the foreground on a new day
let lastDay = TODAY();
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !S.user || !S.profile?.active || lastDay === TODAY()) return;
  lastDay = TODAY(); S.date = TODAY();
  try { await loadData(); } catch (e) {}
  renderShell();
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(() => {});
boot();
</script>
